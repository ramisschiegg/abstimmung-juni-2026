<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Swiss flag: red background with rounded corners -->
  <rect width="100" height="100" rx="18" fill="#D52B1E"/>
  <!-- Swiss cross (official proportions: arms 20/32 of flag, each arm 6/20 wide) -->
  <!-- Vertical arm -->
  <rect x="40" y="20" width="20" height="60" rx="3" fill="white"/>
  <!-- Horizontal arm -->
  <rect x="20" y="40" width="60" height="20" rx="3" fill="white"/>
</svg>
